# .github/workflows/publish.yml
# Automatically publishes inscript-lang to PyPI when you push a version tag.
#
# SETUP (one-time):
#   1. Go to https://pypi.org/manage/account/token/
#      → Add API token → Name: inscript-github → Scope: Project: inscript-lang
#      → Copy the token (starts with pypi-)
#   2. Go to https://github.com/authorss81/inscript/settings/secrets/actions
#      → New repository secret → Name: PYPI_API_TOKEN → paste token → Save
#
# To publish:
#   1. Bump VERSION in inscript_package/inscript.py
#   2. Update version in Cargo.toml files to match
#   3. git tag -a v3.9.4 -m "InScript v3.9.4"
#   4. git push origin v3.9.4
#
# NOTE: version is READ DYNAMICALLY from inscript.py's VERSION constant.
#       The tag must match or the workflow fails immediately.

name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
      - 'v*.*.*'
      - 'v*.*.*.*'

env:
  PACKAGE_DIR: inscript_package

jobs:
  # ──────────────────────────────────────────────
  # 0. Extract & verify version from source
  # ──────────────────────────────────────────────
  version:
    name: Read & verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.getver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: getver
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          VER="$(python -c "
          import re; print(re.search(r'^VERSION\s*=\s*\"([^\"]+)\"', open('inscript.py').read(), re.M).group(1))
          ")"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Source VERSION = ${VER}, Tag = ${GITHUB_REF_NAME}"
          if [ "v${VER}" != "${GITHUB_REF_NAME}" ]; then
            echo "❌ Tag ${GITHUB_REF_NAME} != source v${VER}"
            exit 1
          fi
          echo "✅ Version verified"

  # ──────────────────────────────────────────────
  # 1. Test suite
  # ──────────────────────────────────────────────
  test:
    name: Run tests
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: pip install setuptools-rust pygame pygls
      - run: pip install -e . --no-build-isolation
      - working-directory: ${{ env.PACKAGE_DIR }}
        run: cargo build --release -p inscript-parser
      - working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          if [ -f target/release/inscript_parser.dll ]; then
            cp target/release/inscript_parser.dll target/release/inscript_parser.pyd
            echo "Windows: copied .dll -> .pyd"
          elif [ -f target/release/libinscript_parser.dylib ]; then
            cp target/release/libinscript_parser.dylib target/release/inscript_parser.so
            echo "macOS: copied .dylib -> .so"
          elif [ -f target/release/libinscript_parser.so ]; then
            cp target/release/libinscript_parser.so target/release/inscript_parser.so
            echo "Linux: copied .so"
          else
            echo "No Rust library found — cargo build may have failed"
            ls -la target/release/ 2>/dev/null || true
            exit 1
          fi
      - working-directory: ${{ env.PACKAGE_DIR }}
        run: cargo test --release -p inscript-parser -p inscript-vm-engine
      - working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          python test_lexer.py && python test_parser.py && python test_analyzer.py && \
          python test_interpreter.py && python test_compiler.py && python test_fstring.py && \
          python test_v12.py && python test_v120.py && python test_v130.py && \
          python test_v140.py && python test_v150.py && python test_v160.py && \
          python test_v170.py && python test_v172.py && python test_v173.py && \
          python test_v174.py && python test_v181.py && python test_v182.py && \
          python test_v183.py && python test_v184.py && python test_v191.py && \
          python test_v192.py && python test_v193.py && python test_v194.py && \
          python test_v195.py && python test_v196.py && python test_v197.py && \
          python test_v198.py && python test_v199.py && python test_v1910.py && \
          python test_v1911.py && python test_v1912.py && python test_v1913.py && \
          python test_v1914.py && python test_v1915.py && python test_v200.py && \
          python test_v201.py && python test_v202.py && python test_v203.py && \
          python test_v210.py && python test_v211.py && python test_v212.py && \
          python test_v220.py && python test_v230.py && python test_v240.py && \
          python test_v250.py && python test_v260.py && python test_v270.py && \
          python test_v280.py && python test_v290.py && python test_v2100.py && \
          python test_v2110.py && python test_v2120.py && python test_v2130.py && \
          python test_v300.py

  # ──────────────────────────────────────────────
  # 2. Build cross-platform wheels (cibuildwheel)
  # ──────────────────────────────────────────────
  build_wheels:
    name: Wheel ${{ matrix.platform }}
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux_x86_64
            target: x86_64-unknown-linux-gnu
            archs: x86_64
            cargo_target: x86_64-unknown-linux-gnu
            archs_macos: ""
          - os: ubuntu-24.04-arm
            platform: linux_aarch64
            target: aarch64-unknown-linux-gnu
            archs: aarch64
            cargo_target: aarch64-unknown-linux-gnu
            archs_macos: ""
          - os: macos-latest
            platform: macos_universal2
            target: "aarch64-apple-darwin x86_64-apple-darwin"
            cargo_target: ""
            archs_macos: universal2
          - os: windows-latest
            platform: windows_amd64
            target: x86_64-pc-windows-msvc
            cargo_target: x86_64-pc-windows-msvc
            archs_macos: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: { target: "${{ matrix.target }}" }
      - run: pip install cibuildwheel
      - working-directory: ${{ env.PACKAGE_DIR }}
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-musllinux_* *i686* *win32*"
          CIBW_ARCHS_LINUX: "${{ matrix.archs }}"
          CIBW_BEFORE_ALL_LINUX: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            rustup target add aarch64-unknown-linux-gnu
          CIBW_BEFORE_BUILD: "pip install setuptools-rust"
          CIBW_ARCHS_MACOS: "${{ matrix.archs_macos }}"
          CIBW_ENVIRONMENT: >
            PATH=$HOME/.cargo/bin:$PATH
            MACOSX_DEPLOYMENT_TARGET=10.12
            ${{ matrix.cargo_target && format('CARGO_BUILD_TARGET={0}', matrix.cargo_target) || '' }}
        run: python -m cibuildwheel --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: ${{ env.PACKAGE_DIR }}/dist/*.whl

  # ──────────────────────────────────────────────
  # 3. Build source distribution
  # ──────────────────────────────────────────────
  build_sdist:
    name: Source distribution
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: pip install build setuptools-rust
      - working-directory: ${{ env.PACKAGE_DIR }}
        run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ${{ env.PACKAGE_DIR }}/dist/*.tar.gz

  # ──────────────────────────────────────────────
  # 4. Publish to PyPI
  # ──────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
