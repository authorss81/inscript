[package]
name = "inscript-vm-engine"
version = "3.9.0"
edition = "2021"
authors = ["Shreyasi Sarkar"]
license = "MIT"
description = "InScript VM Engine - High-performance bytecode executor with JIT compilation ready"

[lib]
name = "inscript_vm_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
thiserror = "1.0"
parking_lot = "0.12"
dashmap = "5.5"
ahash = "0.8"

[dev-dependencies]
criterion = "0.5"
proptest = "1.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
