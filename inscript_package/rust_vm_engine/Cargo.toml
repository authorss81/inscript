[package]
name = "inscript-vm-engine"
version = "3.9.6.3"
edition = "2021"
authors = ["Shreyasi Sarkar"]
license = "MIT"
description = "InScript VM Engine - High-performance bytecode executor with LLVM IR emitter"

[lib]
name = "inscript_vm_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
thiserror = "1.0"
parking_lot = "0.12"
dashmap = "5.5"
ahash = "0.8"
libloading = "0.8"

[dev-dependencies]
criterion = "0.5"
proptest = "1.3"

