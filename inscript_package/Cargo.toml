[package]
name = "inscript-vm"
version = "3.7.1"
edition = "2021"
authors = ["Shreyasi Sarkar"]
license = "MIT"

[lib]
name = "inscript_vm"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
