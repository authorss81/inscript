[package]
name = "inscript-lexer"
version = "3.7.2"
edition = "2021"
authors = ["Shreyasi Sarkar"]
license = "MIT"

[lib]
name = "inscript_lexer"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
