[package]
name = "inscript"
version = "3.9.6.38"
edition = "2024"
authors = ["Shreyasi Sarkar"]
license = "MIT"
description = "InScript language — Python core v3.8.2 + Rust VM Engine v3.9.1 (LLVM IR emitter)"

[rust]
vm_engine   = "rust_vm_engine"
parser      = "inscript_rust_parser"

[features]
llvm_ir     = []   # enables IrEmitter path (ir.rs) — requires llc/opt in PATH

[profile.release]
opt-level   = 3
